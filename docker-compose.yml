services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wikipedia
      POSTGRES_PASSWORD: wikipedia
      POSTGRES_DB: wikipedia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wikipedia
      MINIO_ROOT_PASSWORD: wikipedia-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo-data:/data

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.2
    ports:
      - "8880:8880"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://wikipedia:wikipedia@postgres:5432/wikipedia?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://silo:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: wikipedia
      S3_SECRET_KEY: wikipedia-secret
      S3_BUCKET: article-audio
      TTS_BASE_URL: http://kokoro:8880
      TTS_MODEL: kokoro
      TTS_VOICE: pm_alex
    depends_on:
      - postgres
      - redis
      - silo
      - kokoro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  silo-data:
